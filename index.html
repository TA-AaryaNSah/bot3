<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Please Wait</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0d12;
            color: white;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 90%;
            max-width: 420px;
            padding: 35px 25px;
            text-align: center;
            background: #151820;
            border: 1px solid #252a35;
            border-radius: 18px;
        }

        .loader {
            width: 45px;
            height: 45px;
            margin: 0 auto 20px;
            border: 4px solid #30343d;
            border-top-color: white;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        h2 {
            margin: 0 0 10px;
        }

        p {
            color: #999;
            font-size: 14px;
        }

        .error {
            display: none;
            color: #ff6b6b;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="loader" id="loader"></div>

    <h2 id="title">Please wait...</h2>

    <p id="status">
        Preparing your link
    </p>

    <p class="error" id="error">
        This link is invalid or unavailable.
    </p>

</div>

<script type="module" src="js.js"></script>

</body>
</html>
