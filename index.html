<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Access Verification</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 40px; text-align: center; max-width: 450px; width: 90%; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        .screen { display: none; }
        .screen.active { display: block; }
        .svg-icon { margin-bottom: 20px; display: inline-block; }
        h2 { font-size: 24px; margin-bottom: 10px; font-weight: 600; }
        p { color: #94a3b8; font-size: 15px; line-height: 1.5; margin-bottom: 20px; }
        .loader { border: 4px solid #334155; border-top: 4px solid #3b82f6; border-radius: 50%; width: 48px; height: 48px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        .btn { background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; transition: background 0.3s; }
        .btn:hover { background: #2563eb; }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .debug-info { margin-top: 20px; font-size: 12px; color: #475569; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Verifying State -->
        <div id="verifying-screen" class="screen active">
            <div class="loader"></div>
            <h2>Checking Security...</h2>
            <p>Analyzing link source and token validity.</p>
        </div>

        <!-- Success State -->
        <div id="success-screen" class="screen">
            <div class="svg-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
            </div>
            <h2>Access Granted</h2>
            <p>Verification passed. You successfully bypassed the shortener.</p>
            <a href="#" class="btn">Proceed</a>
        </div>

        <!-- Error State -->
        <div id="error-screen" class="screen">
            <div class="svg-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
            </div>
            <h2>Direct Access Denied</h2>
            <p id="error-msg">You are trying to open this link directly. Please go through the official shortener link.</p>
            <a href="https://t.me/your_telegram_channel" class="btn btn-danger">Get Valid Link</a>
            <div class="debug-info" id="debug-info"></div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const sig = urlParams.get('sig');
            const referrer = document.referrer; // Yahi catch karega redirect ko

            function showScreen(id) {
                document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
                document.getElementById(id).classList.add('active');
            }

            setTimeout(() => {
                // Rule 1: Link me 'sig' hona chahiye
                if (!sig) {
                    document.getElementById('error-msg').innerText = "Security token is missing in the URL.";
                    showScreen('error-screen');
                    return;
                }

                // Rule 2: Token lamba hona chahiye aur 'asvm_secure' se end hona chahiye
                if (sig.length < 40 || !sig.endsWith('asvm_secure')) {
                    document.getElementById('error-msg').innerText = "Invalid or tampered security token detected.";
                    showScreen('error-screen');
                    return;
                }

                // Rule 3: Direct URL Paste / Blank Referrer Block
                if (referrer === "" || referrer === null) {
                    document.getElementById('error-msg').innerText = "Direct access blocked! You must click the link from the shortener, you cannot copy-paste it.";
                    document.getElementById('debug-info').innerText = "Error: Blank Referrer Detected";
                    showScreen('error-screen');
                    return;
                }

                // Agar teeno rules pass ho gaye:
                showScreen('success-screen');
                
                // Security trick: URL me se token hata do taaki koi wahan se copy na kar sake
                window.history.replaceState({}, document.title, window.location.pathname);

            }, 1200); // Thoda loading time real feel ke liye
        });
    </script>
</body>
</html>
