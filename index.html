<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Email Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f5f7fb;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: #fff;

      padding: 32px;

      border-radius: 18px;

      box-shadow:
        0 15px 45px rgba(0,0,0,.08);
    }

    .logo {
      width: 55px;
      height: 55px;

      margin: 0 auto 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #111827;
      color: #fff;

      border-radius: 14px;

      font-weight: 700;
      font-size: 20px;
    }

    h1 {
      text-align: center;

      color: #111827;

      font-size: 26px;

      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;

      color: #6b7280;

      font-size: 14px;

      line-height: 1.5;

      margin-bottom: 25px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      color: #374151;

      font-size: 14px;

      font-weight: 600;
    }

    input {
      width: 100%;

      padding: 14px;

      border: 1px solid #d1d5db;

      border-radius: 9px;

      outline: none;

      font-size: 15px;

      transition: .2s;
    }

    input:focus {
      border-color: #111827;

      box-shadow:
        0 0 0 3px rgba(17,24,39,.08);
    }

    button {
      width: 100%;

      margin-top: 16px;

      padding: 14px;

      border: 0;

      border-radius: 9px;

      background: #111827;

      color: #fff;

      font-size: 15px;

      font-weight: 600;

      cursor: pointer;

      transition: .2s;
    }

    button:hover {
      background: #000;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      display: none;

      margin-top: 18px;

      padding: 12px;

      border-radius: 9px;

      font-size: 13px;

      line-height: 1.5;

      text-align: center;
    }

    #message.success {
      display: block;

      background: #ecfdf5;

      color: #047857;
    }

    #message.error {
      display: block;

      background: #fef2f2;

      color: #b91c1c;
    }

    .info {
      margin-top: 20px;

      text-align: center;

      font-size: 12px;

      color: #9ca3af;

      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">
      CB
    </div>

    <h1>
      Continue with Email
    </h1>

    <p class="subtitle">
      Enter your email address and we'll send you
      a secure login link.
    </p>

    <form id="emailForm">

      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        placeholder="you@example.com"
        autocomplete="email"
        required
      >

      <button
        type="submit"
        id="sendBtn"
      >
        Send Login Link
      </button>

    </form>

    <div id="message"></div>

    <p class="info">
      No password required. The secure link will be
      sent to your email.
    </p>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      sendSignInLinkToEmail,
      isSignInWithEmailLink,
      signInWithEmailLink
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    // ==========================================
    // FIREBASE CONFIG
    // ==========================================

    const firebaseConfig = {

      apiKey:
        "AIzaSyAcR-I0os4RjzUfX-GxUjt8A9exVLKQm5U",

      authDomain:
        "cbtempmailbot.firebaseapp.com",

      projectId:
        "cbtempmailbot",

      storageBucket:
        "cbtempmailbot.firebasestorage.app",

      messagingSenderId:
        "978429876436",

      appId:
        "1:978429876436:web:163070d5a5df0e71954341",

      measurementId:
        "G-FHK0NVEY82"

    };


    // ==========================================
    // INITIALIZE
    // ==========================================

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);


    // ==========================================
    // ELEMENTS
    // ==========================================

    const form =
      document.getElementById("emailForm");

    const emailInput =
      document.getElementById("email");

    const sendBtn =
      document.getElementById("sendBtn");

    const message =
      document.getElementById("message");


    // ==========================================
    // SHOW MESSAGE
    // ==========================================

    function showMessage(text, type) {

      message.textContent = text;

      message.className = type;

    }


    function clearMessage() {

      message.textContent = "";

      message.className = "";

    }


    // ==========================================
    // GET EMAIL FROM URL
    //
    // index.html?email=test@example.com
    // ==========================================

    const params =
      new URLSearchParams(
        window.location.search
      );

    const urlEmail =
      params.get("email");


    if (urlEmail) {

      try {

        emailInput.value =
          decodeURIComponent(urlEmail)
            .trim();

      } catch {

        emailInput.value =
          urlEmail.trim();

      }

    }


    // ==========================================
    // SEND LOGIN LINK
    // ==========================================

    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        clearMessage();

        const email =
          emailInput.value.trim();


        if (!email) {

          showMessage(
            "Please enter your email address.",
            "error"
          );

          return;

        }


        sendBtn.disabled = true;

        sendBtn.textContent =
          "Sending...";


        try {

          /*
           * IMPORTANT:
           *
           * This URL must be added to:
           *
           * Firebase Console
           * → Authentication
           * → Settings
           * → Authorized domains
           *
           */

          const actionCodeSettings = {

            url:
              window.location.origin +
              window.location.pathname,

            handleCodeInApp: true

          };


          await sendSignInLinkToEmail(
            auth,
            email,
            actionCodeSettings
          );


          /*
           * Save email locally.
           * Firebase needs the email again
           * when the user opens the link.
           */

          localStorage.setItem(
            "firebaseLoginEmail",
            email
          );


          showMessage(
            "Login link sent successfully! Check your email inbox and open the link.",
            "success"
          );


          sendBtn.textContent =
            "Link Sent";


        } catch (error) {

          console.error(error);


          let errorMessage =
            "Unable to send login link.";


          switch (error.code) {

            case "auth/invalid-email":

              errorMessage =
                "Please enter a valid email address.";

              break;


            case "auth/unauthorized-continue-uri":

              errorMessage =
                "This domain is not authorized in Firebase.";

              break;


            case "auth/too-many-requests":

              errorMessage =
                "Too many requests. Please try again later.";

              break;


            case "auth/network-request-failed":

              errorMessage =
                "Network error. Check your internet connection.";

              break;


            default:

              errorMessage =
                error.message ||
                errorMessage;

          }


          showMessage(
            errorMessage,
            "error"
          );


          sendBtn.disabled = false;

          sendBtn.textContent =
            "Send Login Link";

        }

      }
    );


    // ==========================================
    // HANDLE EMAIL LOGIN LINK
    // ==========================================

    async function handleEmailLink() {

      if (
        !isSignInWithEmailLink(
          auth,
          window.location.href
        )
      ) {

        return;

      }


      let email =
        localStorage.getItem(
          "firebaseLoginEmail"
        );


      /*
       * If localStorage doesn't contain
       * the email, ask the user for it.
       */

      if (!email) {

        email =
          window.prompt(
            "Please enter your email address:"
          );

      }


      if (!email) {

        showMessage(
          "Email address is required to complete login.",
          "error"
        );

        return;

      }


      try {

        sendBtn.disabled = true;

        sendBtn.textContent =
          "Verifying...";


        const result =
          await signInWithEmailLink(
            auth,
            email,
            window.location.href
          );


        /*
         * Remove saved email after
         * successful authentication.
         */

        localStorage.removeItem(
          "firebaseLoginEmail"
        );


        showMessage(
          "Email verified successfully! You are now logged in.",
          "success"
        );


        console.log(
          "Logged in user:",
          result.user
        );


        /*
         * Remove login parameters from URL
         */

        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );


        /*
         * Redirect to dashboard
         */

        setTimeout(() => {

          window.location.href =
            "dashboard.html";

        }, 1000);


      } catch (error) {

        console.error(error);


        let errorMessage =
          "This login link is invalid or expired.";


        switch (error.code) {

          case "auth/invalid-email":

            errorMessage =
              "The email address is invalid.";

            break;


          case "auth/invalid-action-code":

            errorMessage =
              "This login link is invalid or has expired.";

            break;


          case "auth/expired-action-code":

            errorMessage =
              "This login link has expired. Please request a new one.";

            break;


          case "auth/too-many-requests":

            errorMessage =
              "Too many attempts. Please try again later.";

            break;


          default:

            errorMessage =
              error.message ||
              errorMessage;

        }


        showMessage(
          errorMessage,
          "error"
        );


        sendBtn.disabled = false;

        sendBtn.textContent =
          "Send Login Link";

      }

    }


    // ==========================================
    // START EMAIL LINK HANDLER
    // ==========================================

    handleEmailLink();

  </script>

</body>
</html>
