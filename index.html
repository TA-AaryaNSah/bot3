<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Required</title>
    <style>
        body { background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: sans-serif; }
        .container { background: rgba(30, 41, 59, 0.7); padding: 40px; border-radius: 16px; text-align: center; border: 1px solid #334155; }
        .hidden { display: none; }
        .visible { display: block; }
        .loader { border: 4px solid #334155; border-top: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div id="verifying" class="visible">
            <div class="loader"></div>
            <h2>Validating Access...</h2>
        </div>
        <div id="content" class="hidden">
            <h2>Access Granted! ✅</h2>
            <p>Redirecting to your content...</p>
        </div>
        <div id="denied" class="hidden">
            <h2>Access Denied 🚫</h2>
            <p>Direct access is prohibited. Please use the valid shortener link.</p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sig = urlParams.get('sig');

        // Strong Anti-Bypass Check
        if (sig && sig.endsWith('asvm_secure') && sig.length > 40) {
            document.getElementById('verifying').className = 'hidden';
            document.getElementById('content').className = 'visible';
            // Yahan content load karo ya redirect karo
            console.log("Verified Access");
        } else {
            document.getElementById('verifying').className = 'hidden';
            document.getElementById('denied').className = 'visible';
        }
    </script>
</body>
</html>
