<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ASVM Link Generator</title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #0b0d12;

            color: white;

            font-family:
                Arial,
                sans-serif;
        }


        .container {
            width: 100%;
            max-width: 650px;

            background: #151820;

            border:
                1px solid #272c36;

            border-radius: 20px;

            padding: 30px;
        }


        h1 {
            margin: 0 0 8px;

            font-size: 27px;
        }


        .subtitle {
            margin-bottom: 25px;

            color: #8f96a3;

            font-size: 14px;
        }


        .group {
            margin-bottom: 18px;
        }


        label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: 600;
        }


        input,
        textarea {
            width: 100%;

            padding: 14px;

            border:
                1px solid #303541;

            border-radius: 10px;

            background: #0e1015;

            color: white;

            outline: none;

            font-size: 14px;
        }


        textarea {
            min-height: 90px;

            resize: vertical;
        }


        input:focus,
        textarea:focus {
            border-color: #666;
        }


        button {
            width: 100%;

            padding: 14px;

            border: 0;

            border-radius: 10px;

            background: white;

            color: black;

            font-weight: bold;

            font-size: 15px;

            cursor: pointer;
        }


        button:hover {
            opacity: .9;
        }


        .result {
            display: none;

            margin-top: 25px;

            padding-top: 25px;

            border-top:
                1px solid #2a2e38;
        }


        .short-url {
            display: flex;

            gap: 10px;
        }


        .short-url input {
            flex: 1;
        }


        .copy {
            width: auto;

            min-width: 100px;

            margin: 0;
        }


        .success {
            margin-top: 12px;

            color: #72e072;

            font-size: 13px;

            display: none;
        }


        .loading {
            display: none;

            margin-top: 12px;

            color: #aaa;

            font-size: 13px;
        }


        @media(max-width: 500px) {

            .container {
                padding: 22px;
            }

            .short-url {
                flex-direction: column;
            }

            .copy {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<div class="container">

    <h1>ASVM Link Generator</h1>

    <div class="subtitle">
        Create a short Firebase-powered redirect link.
    </div>


    <!-- MAIN URL -->

    <div class="group">

        <label>
            Main URL *
        </label>

        <input
            type="url"
            id="mainUrl"
            placeholder="https://example.com/page"
        >

    </div>


    <!-- TITLE -->

    <div class="group">

        <label>
            Title
        </label>

        <input
            type="text"
            id="title"
            placeholder="My Redirect"
        >

    </div>


    <!-- DESCRIPTION -->

    <div class="group">

        <label>
            Description
        </label>

        <textarea
            id="description"
            placeholder="Optional description"
        ></textarea>

    </div>


    <!-- CUSTOM DATA -->

    <div class="group">

        <label>
            ASVM Data
        </label>

        <textarea
            id="asvmData"
            placeholder='{"type":"movie","id":"12345"}'
        ></textarea>

    </div>


    <button id="generate">
        Generate Short Link
    </button>


    <div
        class="loading"
        id="loading"
    >
        Creating short link...
    </div>


    <!-- RESULT -->

    <div
        class="result"
        id="result"
    >

        <label>
            Your Short Link
        </label>


        <div class="short-url">

            <input
                type="text"
                id="shortUrl"
                readonly
            >

            <button
                class="copy"
                id="copy"
            >
                Copy
            </button>

        </div>


        <div
            class="success"
            id="success"
        >
            Short link copied!
        </div>

    </div>

</div>


<script type="module">


import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getDatabase,
    ref,
    set
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


// ====================================
// FIREBASE
// ====================================

const firebaseConfig = {

    apiKey:
        "AIzaSyAw5aG4WghgQtTqtSWY7YBMo28p-eTx1BM",

    authDomain:
        "realtime-64520.firebaseapp.com",

    databaseURL:
        "https://realtime-64520-default-rtdb.firebaseio.com",

    projectId:
        "realtime-64520",

    storageBucket:
        "realtime-64520.firebasestorage.app",

    messagingSenderId:
        "116693487239",

    appId:
        "1:116693487239:web:e3075a83602a20af2cb222",

    measurementId:
        "G-9LNW64HM7Y"

};


const app =
    initializeApp(firebaseConfig);


const db =
    getDatabase(app);


// ====================================
// ELEMENTS
// ====================================

const generate =
    document.getElementById("generate");

const loading =
    document.getElementById("loading");

const result =
    document.getElementById("result");

const shortUrl =
    document.getElementById("shortUrl");


// ====================================
// RANDOM SHORT ID
// ====================================

function generateShortId(length = 8) {

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";

    let id = "";

    const array =
        new Uint32Array(length);

    crypto.getRandomValues(array);


    for (let i = 0; i < length; i++) {

        id += chars[
            array[i] % chars.length
        ];

    }


    return id;

}


// ====================================
// GENERATE
// ====================================

generate.addEventListener(
    "click",
    async () => {

        const mainUrl =
            document
                .getElementById("mainUrl")
                .value
                .trim();


        const title =
            document
                .getElementById("title")
                .value
                .trim();


        const description =
            document
                .getElementById("description")
                .value
                .trim();


        const asvmDataRaw =
            document
                .getElementById("asvmData")
                .value
                .trim();


        // ==========================
        // VALIDATE URL
        // ==========================

        if (!mainUrl) {

            alert(
                "Please enter the main URL."
            );

            return;
        }


        let parsedUrl;

        try {

            parsedUrl =
                new URL(mainUrl);

        } catch {

            alert(
                "Please enter a valid URL."
            );

            return;
        }


        if (
            parsedUrl.protocol !== "https:" &&
            parsedUrl.protocol !== "http:"
        ) {

            alert(
                "Only HTTP/HTTPS URLs are allowed."
            );

            return;
        }


        // ==========================
        // ASVM DATA
        // ==========================

        let asvmData = {};


        if (asvmDataRaw) {

            try {

                asvmData =
                    JSON.parse(asvmDataRaw);

            } catch {

                alert(
                    "ASVM Data must be valid JSON."
                );

                return;
            }

        }


        // ==========================
        // LOADING
        // ==========================

        generate.disabled = true;

        loading.style.display = "block";


        try {

            // ======================
            // CREATE RANDOM ID
            // ======================

            const id =
                generateShortId(8);


            // ======================
            // SAVE TO FIREBASE
            // ======================

            await set(
                ref(db, "links/" + id),
                {

                    url: parsedUrl.href,

                    title:
                        title || "Redirect",

                    description:
                        description || "",

                    asvm:
                        asvmData,

                    active: true,

                    createdAt:
                        Date.now()

                }
            );


            // ======================
            // CREATE SHORT URL
            // ======================

            const base =
                window.location.origin +
                window.location.pathname
                    .substring(
                        0,
                        window.location.pathname
                            .lastIndexOf("/")
                    );


            const finalUrl =
                base +
                "/index.html?l=" +
                id;


            shortUrl.value =
                finalUrl;


            result.style.display =
                "block";


        } catch (error) {

            console.error(error);

            alert(
                "Could not create short link."
            );

        }


        loading.style.display =
            "none";

        generate.disabled =
            false;

    }
);


// ====================================
// COPY
// ====================================

document
    .getElementById("copy")
    .addEventListener(
        "click",
        async () => {

            const value =
                shortUrl.value;


            try {

                await navigator
                    .clipboard
                    .writeText(value);

            } catch {

                shortUrl.select();

                document.execCommand(
                    "copy"
                );

            }


            const success =
                document.getElementById(
                    "success"
                );


            success.style.display =
                "block";


            setTimeout(
                () => {

                    success.style.display =
                        "none";

                },
                2000
            );

        }
    );

</script>


</body>
</html>
