<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ASVM Link Manager</title>


<style>

/* ================================================= */
/* GLOBAL */
/* ================================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    min-height: 100vh;

    background: #0b0d12;

    color: #ffffff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

button,
input {
    font-family: inherit;
}


/* ================================================= */
/* LOGIN */
/* ================================================= */

#loginPage {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;
}

.login-box {

    width: 100%;

    max-width: 400px;

    padding: 30px;

    background: #151820;

    border: 1px solid #272c36;

    border-radius: 18px;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.35);
}

.login-title {

    margin: 0 0 8px;

    font-size: 27px;
}

.login-subtitle {

    margin: 0 0 25px;

    color: #8f96a3;

    font-size: 14px;
}


/* ================================================= */
/* ADMIN */
/* ================================================= */

.hidden {
    display: none !important;
}

.container {

    width: 100%;

    max-width: 1100px;

    margin: auto;

    padding: 25px;
}


/* ================================================= */
/* HEADER */
/* ================================================= */

.header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 25px;

    gap: 15px;
}

.logo {

    font-size: 24px;

    font-weight: 700;
}

.header-right {

    display: flex;

    align-items: center;

    gap: 10px;
}

.admin-email {

    color: #8f96a3;

    font-size: 12px;
}

.logout {

    padding: 9px 14px;

    border-radius: 9px;

    border: 1px solid #343946;

    background: #242833;

    color: white;

    cursor: pointer;
}


/* ================================================= */
/* CARD */
/* ================================================= */

.card {

    background: #151820;

    border: 1px solid #272c36;

    border-radius: 16px;

    padding: 22px;

    margin-bottom: 20px;
}

.card-title {

    margin: 0 0 18px;

    font-size: 18px;
}


/* ================================================= */
/* INPUT */
/* ================================================= */

.group {

    margin-bottom: 16px;
}

label {

    display: block;

    margin-bottom: 8px;

    font-size: 13px;

    font-weight: 600;
}

input {

    width: 100%;

    padding: 13px 14px;

    background: #0e1015;

    color: #fff;

    border: 1px solid #303541;

    border-radius: 9px;

    outline: none;

    font-size: 14px;
}

input:focus {

    border-color: #707783;
}


/* ================================================= */
/* BUTTONS */
/* ================================================= */

.btn {

    border: 0;

    border-radius: 9px;

    padding: 11px 15px;

    cursor: pointer;

    font-weight: 600;

    font-size: 13px;
}

.btn-primary {

    background: #ffffff;

    color: #000000;
}

.btn-secondary {

    background: #242833;

    color: #ffffff;
}

.btn-danger {

    background: #432126;

    color: #ff9da7;
}

.btn-success {

    background: #183b29;

    color: #83e6a7;
}

.btn:disabled {

    opacity: .5;

    cursor: not-allowed;
}


/* ================================================= */
/* LOGIN BUTTON */
/* ================================================= */

.login-button {

    width: 100%;

    padding: 14px;

    border: 0;

    border-radius: 10px;

    background: white;

    color: black;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;
}


/* ================================================= */
/* ERROR */
/* ================================================= */

.error {

    display: none;

    margin-top: 12px;

    color: #ff7474;

    font-size: 13px;
}


/* ================================================= */
/* GENERATOR */
/* ================================================= */

.generator {

    display: flex;

    gap: 10px;
}

.generator input {

    flex: 1;
}

.generator button {

    min-width: 130px;
}


/* ================================================= */
/* LOADING */
/* ================================================= */

.loading {

    display: none;

    margin-top: 12px;

    color: #999;

    font-size: 13px;
}


/* ================================================= */
/* GENERATED */
/* ================================================= */

.generated {

    display: none;

    margin-top: 18px;

    padding: 15px;

    background: #0e1015;

    border: 1px solid #303541;

    border-radius: 10px;
}

.generated-row {

    display: flex;

    gap: 10px;
}

.generated-row input {

    flex: 1;
}

.generated-row button {

    min-width: 100px;
}

.success {

    display: none;

    margin-top: 9px;

    color: #70df70;

    font-size: 13px;
}


/* ================================================= */
/* STATS */
/* ================================================= */

.stats {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 12px;

    margin-bottom: 20px;
}

.stat {

    padding: 18px;

    background: #151820;

    border: 1px solid #272c36;

    border-radius: 14px;
}

.stat-name {

    color: #8f96a3;

    font-size: 13px;

    margin-bottom: 8px;
}

.stat-value {

    font-size: 25px;

    font-weight: 700;
}


/* ================================================= */
/* MANAGEMENT HEADER */
/* ================================================= */

.management-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    margin-bottom: 18px;
}

.management-buttons {

    display: flex;

    gap: 8px;
}


/* ================================================= */
/* TABLE */
/* ================================================= */

.table-wrap {

    overflow-x: auto;
}

table {

    width: 100%;

    min-width: 800px;

    border-collapse: collapse;
}

th,
td {

    padding: 13px 10px;

    text-align: left;

    border-bottom:
        1px solid #272c36;

    font-size: 13px;
}

th {

    color: #8f96a3;

    font-weight: 600;
}

.destination {

    max-width: 280px;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;
}

.short-id {

    color: #9fc5ff;

    font-weight: 600;
}

.status {

    display: inline-block;

    padding: 5px 9px;

    border-radius: 20px;

    font-size: 11px;
}

.status-active {

    background: #173b27;

    color: #75e39d;
}

.status-disabled {

    background: #432126;

    color: #ff9da7;
}

.actions {

    display: flex;

    gap: 6px;

    flex-wrap: nowrap;
}

.actions button {

    padding: 7px 9px;

    font-size: 11px;

    white-space: nowrap;
}


/* ================================================= */
/* EMPTY */
/* ================================================= */

.empty {

    text-align: center;

    color: #777;

    padding: 35px !important;
}


/* ================================================= */
/* MOBILE */
/* ================================================= */

@media(max-width: 750px) {

    .container {

        padding: 15px;
    }

    .stats {

        grid-template-columns:
            repeat(2, 1fr);
    }

    .generator {

        flex-direction: column;
    }

    .generator button {

        width: 100%;
    }

    .generated-row {

        flex-direction: column;
    }

    .generated-row button {

        width: 100%;
    }

    .header {

        align-items: flex-start;
    }

    .admin-email {

        display: none;
    }

    .management-header {

        align-items: stretch;

        flex-direction: column;
    }

}

</style>

</head>


<body>

} from

// ==================================================

const firebaseConfig = {

        "realtime-64520.firebasestorage.app",

    messagingSenderId:
        "116693487239",

    appId:
        "1:116693487239:web:e3075a83602a20af2cb222",

    measurementId:
        "G-9LNW64HM7Y"

};


const app =
    initializeApp(
        firebaseConfig
    );


const db =
    getDatabase(app);



// ==================================================
// ADMIN LOGIN
// ==================================================

const ADMIN_EMAIL =
    "demo@gmail.com";

const ADMIN_PASSWORD =
    "demo@gmail.com";


// ==================================================
// ELEMENTS
// ==================================================

const loginPage =
    document.getElementById(
        "loginPage"
    );


const adminPage =
    document.getElementById(
        "adminPage"
    );


const loginError =
    document.getElementById(
        "loginError"
    );


// ==================================================
// LOGIN FUNCTION
// ==================================================

document

    .addEventListener(
        "click",

    );


document
    .getElementById("password")
    .addEventListener(

            ) {

            }

        }

document

            if (
                event.key === "Enter"
            ) {

                login();

            }

        }
    );


function login() {

}


// ==================================================
// CHECK LOGIN
// ==================================================

if (
    sessionStorage.getItem(
        "asvm_admin"
    ) === "true"
) {

    showAdmin();

}


// ==================================================
// SHOW ADMIN
// ==================================================

function showAdmin() {

    loginPage.classList.add(

    );

    adminPage.classList.remove(
        "hidden"
    );

    loadLinks();

}


// ==================================================
// LOGOUT
// ==================================================

document
    .getElementById("logoutBtn")
    .addEventListener(
        "click",
        () => {

            sessionStorage.removeItem(
                "asvm_admin"
            );


            adminPage.classList.add(

            loginPage.classList.remove(

                    "password"

// ==================================================
// RANDOM SHORT ID
// ==================================================

function generateShortId(
    length = 7
) {

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";


    const values =
        new Uint32Array(
            length
        );


    crypto.getRandomValues(
        values
    );


    let id = "";


    for (
        let i = 0;
        i < length;
        i++
    ) {

        id +=
            chars[
                values[i] %
                chars.length
            ];

    }


    return id;

}


// ==================================================
// CREATE LINK
// ==================================================

document
    .getElementById(
        "generateBtn"
    )
    .addEventListener(
        "click",
        createLink
    );


async function createLink() {

    const input =
        document.getElementById(
            "mainUrl"
        );


    const url =
        input.value.trim();


    const error =
        document.getElementById(
            "generateError"
        );


    const loading =
        document.getElementById(
            "loading"
        );


    const button =
        document.getElementById(
            "generateBtn"
        );


    error.style.display =
        "none";


    if (!url) {

        showGenerateError(
            "Please enter a URL."
        );

        return;

    }


    let parsed;


    try {

        parsed =
            new URL(url);

    } catch {

        showGenerateError(
            "Please enter a valid URL."
        );

        return;

    }


    if (
        parsed.protocol !== "http:" &&
        parsed.protocol !== "https:"
    ) {

        showGenerateError(
            "Only HTTP and HTTPS URLs are allowed."
        );

        return;

    }


    button.disabled =
        true;

    loading.style.display =
        "block";


    try {

        let shortId = null;


        /*
         * Generate unique ID
         */

        for (
            let attempt = 0;
            attempt < 10;
            attempt++
        ) {

            const possibleId =
                generateShortId();


            const snapshot =
                await get(
                    ref(
                        db,
                        "links/" +
                        possibleId
                    )
                );


            if (!snapshot.exists()) {

                shortId =
                    possibleId;

                break;

            }

        }


        if (!shortId) {

            throw new Error(
                "Could not generate unique ID."
            );

        }


        /*
         * Save URL
         */

        await set(

            ref(
                db,
                "links/" +
                shortId
            ),

            {

                url:
                    parsed.href,

                active:
                    true,

                clicks:
                    0,

                createdAt:
                    Date.now()

            }

        );


        /*
         * Clean short URL
         */

        const shortUrl =
            window.location.origin +
            "/go/" +
            shortId;


        document
            .getElementById(
                "generatedUrl"
            )
            .value =
            shortUrl;


        document
            .getElementById(
                "generated"
            )
            .style.display =
            "block";


        input.value =
            "";


        /*
         * Refresh table
         */

        await loadLinks();


    } catch (err) {

        console.error(err);

        showGenerateError(
            "Unable to create short link."
        );

    }


    loading.style.display =
        "none";

    button.disabled =
        false;

}


// ==================================================
// GENERATE ERROR
// ==================================================

function showGenerateError(
    message
) {

    const error =
        document.getElementById(
            "generateError"
        );


    error.textContent =
        message;


    error.style.display =
        "block";

}


// ==================================================
// COPY GENERATED LINK
// ==================================================

document
    .getElementById(
        "copyGenerated"
    )
    .addEventListener(
        "click",
        async () => {

            const input =
                document.getElementById(
                    "generatedUrl"
                );


            await copyText(
                input.value
            );


            const success =
                document.getElementById(
                    "copySuccess"
                );


            success.style.display =
                "block";


            setTimeout(
                () => {

                    success.style.display =
                        "none";

                },
                2000
            );

        }
    );


// ==================================================
// LOAD LINKS
// ==================================================

let allLinks = [];


async function loadLinks() {

    try {

        const snapshot =
            await get(
                ref(
                    db,
                    "links"
                )
            );


        allLinks = [];


        if (snapshot.exists()) {

            const data =
                snapshot.val();


            Object
                .entries(data)
                .forEach(
                    ([id, value]) => {

                        allLinks.push({

                            id:

                                id,

                            url:

                                value.url || "",

                            active:

                                value.active !== false,

                            clicks:

                                Number(
                                    value.clicks || 0
                                ),

                            createdAt:

                                value.createdAt || 0

                        });

                    }
                );

        }


        allLinks.sort(
            (a, b) =>
                b.createdAt -
                a.createdAt
        );


        updateStats();

        renderLinks();


    } catch (error) {

        console.error(error);

        alert(
            "Unable to load Firebase data."
        );

    }

}


// ==================================================
// STATS
// ==================================================

function updateStats() {

    const total =
        allLinks.length;


    const active =
        allLinks.filter(
            item =>
                item.active
        ).length;


    const disabled =
        allLinks.filter(
            item =>
                !item.active
        ).length;


    const clicks =
        allLinks.reduce(
            (
                total,
                item
            ) =>
                total +
                item.clicks,
            0
        );


    document
        .getElementById(
            "totalLinks"
        )
        .textContent =
        total;


    document
        .getElementById(
            "activeLinks"
        )
        .textContent =
        active;


    document
        .getElementById(
            "disabledLinks"
        )
        .textContent =
        disabled;


    document
        .getElementById(
            "totalClicks"
        )
        .textContent =
        clicks;

}


// ==================================================
// RENDER LINKS
// ==================================================

function renderLinks() {

    const tbody =
        document.getElementById(
            "linksTable"
        );


    const search =
        document
            .getElementById(
                "search"
            )
            .value
            .toLowerCase()
            .trim();


    tbody.innerHTML = "";


    const filtered =
        allLinks.filter(
            item => {

                return (

                    item.id
                        .toLowerCase()
                        .includes(search)

                    ||

                    item.url
                        .toLowerCase()
                        .includes(search)

                );

            }
        );


    if (!filtered.length) {

        tbody.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="empty"
                >
                    No links found.
                </td>

            </tr>

        `;

        return;

    }


    filtered.forEach(
        item => {

            const row =
                document.createElement(
                    "tr"
                );


            const shortUrl =
                window.location.origin +
                "/go/" +
                item.id;


            const date =
                item.createdAt

                    ? new Date(
                        item.createdAt
                    ).toLocaleString()

                    : "-";


            row.innerHTML = `

                <td>

                    <span class="short-id">

                        ${escapeHtml(
                            item.id
                        )}

                    </span>

                </td>


                <td>

                    <div
                        class="destination"
                        title="${escapeHtml(
                            item.url
                        )}"
                    >

                        ${escapeHtml(
                            item.url
                        )}

                    </div>

                </td>


                <td>

                    ${
                        item.active

                        ?

                        `<span
                            class="status status-active"
                        >
                            Active
                        </span>`

                        :

                        `<span
                            class="status status-disabled"
                        >
                            Disabled
                        </span>`
                    }

                </td>


                <td>
                    ${item.clicks}
                </td>


                <td>
                    ${escapeHtml(date)}
                </td>


                <td>

                    <div class="actions">


                        <button
                            class="btn btn-secondary"
                            data-copy="${escapeHtml(
                                item.id
                            )}"
                        >
                            Copy
                        </button>


                        <button
                            class="${
                                item.active
                                ? "btn btn-danger"
                                : "btn btn-success"
                            }"
                            data-toggle="${escapeHtml(
                                item.id
                            )}"
                        >

                            ${
                                item.active
                                ? "Disable"
                                : "Enable"
                            }

                        </button>


                        <button
                            class="btn btn-danger"
                            data-delete="${escapeHtml(
                                item.id
                            )}"
                        >
                            Delete
                        </button>


                    </div>

                </td>

            `;


            tbody.appendChild(
                row
            );

        }
    );


    /*
     * Copy
     */

    tbody
        .querySelectorAll(
            "[data-copy]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    async () => {

                        const id =
                            button.dataset.copy;


                        const url =
                            window.location.origin +
                            "/go/" +
                            id;


                        await copyText(
                            url
                        );


                        const old =
                            button.textContent;


                        button.textContent =
                            "Copied";


                        setTimeout(
                            () => {

                                button.textContent =
                                    old;

                            },
                            1500
                        );

                    }
                );

            }
        );


    /*
     * Toggle
     */

    tbody
        .querySelectorAll(
            "[data-toggle]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    async () => {

                        const id =
                            button.dataset.toggle;


                        const item =
                            allLinks.find(
                                x =>
                                    x.id === id
                            );


                        if (!item)
                            return;


                        try {

                            await update(

                                ref(
                                    db,
                                    "links/" +
                                    id
                                ),

                                {

                                    active:
                                        !item.active

                                }

                            );


                            await loadLinks();


                        } catch (error) {

                            console.error(
                                error
                            );

                            alert(
                                "Unable to update link."
                            );

                        }

                    }
                );

            }
        );


    /*
     * Delete
     */

    tbody
        .querySelectorAll(
            "[data-delete]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    async () => {

                        const id =
                            button.dataset.delete;


                        if (
                            !confirm(
                                "Are you sure you want to delete this link?"
                            )
                        ) {

                            return;

                        }


                        try {

                            await remove(

                                ref(
                                    db,
                                    "links/" +
                                    id
                                )

                            );


                            await loadLinks();


                        } catch (error) {

                            console.error(
                                error
                            );

                            alert(
                                "Unable to delete link."
                            );

                        }

                    }
                );

            }
        );

}


// ==================================================
// SEARCH
// ==================================================

document
    .getElementById(
        "search"
    )
    .addEventListener(
        "input",
        renderLinks
    );


// ==================================================
// REFRESH
// ==================================================

document
    .getElementById(
        "refreshBtn"
    )
    .addEventListener(
        "click",
        loadLinks
    );


// ==================================================
// COPY HELPER
// ==================================================

async function copyText(
    text
) {

    try {

        await navigator
            .clipboard
            .writeText(text);

    } catch {

        const textarea =
            document.createElement(
                "textarea"
            );


        textarea.value =
            text;


        textarea.style.position =
            "fixed";

        textarea.style.opacity =
            "0";


        document.body.appendChild(
            textarea
        );


        textarea.select();


        document.execCommand(
            "copy"
        );


        textarea.remove();

    }

}


// ==================================================
// ESCAPE HTML
// ==================================================

function escapeHtml(
    value
) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
