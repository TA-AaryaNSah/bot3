<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Redirect URL Generator</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #0f1115;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: #181b22;
            padding: 30px;
            border-radius: 18px;
        }

        h1 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #999;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #30343d;
            border-radius: 10px;
            background: #101218;
            color: white;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #777;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: white;
            color: black;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: .9;
        }

        .result {
            display: none;
            margin-top: 25px;
        }

        .result textarea {
            width: 100%;
            min-height: 110px;
            resize: none;
            padding: 14px;
            background: #101218;
            border: 1px solid #30343d;
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .copy {
            margin-top: 10px;
        }

        .message {
            margin-top: 12px;
            font-size: 13px;
            color: #8ee28e;
            display: none;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Redirect URL Generator</h1>

    <p class="subtitle">
        Enter your main URL to generate an encrypted redirect link.
    </p>

    <label for="mainLink">
        Main URL
    </label>

    <input
        type="url"
        id="mainLink"
        placeholder="https://example.com/page"
        autocomplete="off"
    >

    <button onclick="generateURL()">
        Generate Redirect URL
    </button>

    <div class="result" id="result">

        <label>
            Generated URL
        </label>

        <textarea
            id="generatedURL"
            readonly
        ></textarea>

        <button class="copy" onclick="copyURL()">
            Copy URL
        </button>

        <div class="message" id="message">
            URL copied successfully!
        </div>

    </div>

</div>


<script>

function encodeLink(url) {

    /*
     * Convert URL to UTF-8 bytes
     */
    const bytes = new TextEncoder().encode(url);

    /*
     * Convert bytes to binary string
     */
    let binary = "";

    bytes.forEach(byte => {
        binary += String.fromCharCode(byte);
    });

    /*
     * Base64 encode
     *
     * URL-safe Base64:
     * + -> -
     * / -> _
     * = removed
     */
    return btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=/g, "");

}


function generateURL() {

    const input = document.getElementById("mainLink");
    const result = document.getElementById("result");
    const output = document.getElementById("generatedURL");

    const mainLink = input.value.trim();

    if (!mainLink) {
        alert("Please enter a URL.");
        return;
    }

    let url;

    try {

        url = new URL(mainLink);

    } catch (error) {

        alert("Please enter a valid URL.");
        return;

    }

    /*
     * Only HTTP / HTTPS URLs
     */
    if (
        url.protocol !== "http:" &&
        url.protocol !== "https:"
    ) {

        alert("Only HTTP and HTTPS URLs are allowed.");
        return;

    }

    /*
     * Encode main URL
     */
    const encrypted = encodeLink(url.href);

    /*
     * Current generator location
     *
     * Example:
     * https://yourdomain.com/generator.html
     *
     * becomes:
     * https://yourdomain.com/index.html?link=XXXXX
     */

    const basePath =
        window.location.href
            .substring(
                0,
                window.location.href.lastIndexOf("/")
            );

    const finalURL =
        basePath +
        "/index.html?link=" +
        encodeURIComponent(encrypted);

    output.value = finalURL;

    result.style.display = "block";

}


async function copyURL() {

    const output =
        document.getElementById("generatedURL");

    const message =
        document.getElementById("message");

    try {

        await navigator.clipboard.writeText(
            output.value
        );

        message.style.display = "block";

        setTimeout(() => {
            message.style.display = "none";
        }, 2000);

    } catch (error) {

        /*
         * Fallback for older browsers
         */
        output.select();

        document.execCommand("copy");

        message.style.display = "block";

        setTimeout(() => {
            message.style.display = "none";
        }, 2000);

    }

}

</script>

</body>
</html>
