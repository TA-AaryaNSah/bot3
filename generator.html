<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Short Link Generator</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #0b0d12;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 550px;
            padding: 30px;
            background: #151820;
            border: 1px solid #272c36;
            border-radius: 20px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 26px;
        }

        .subtitle {
            margin-bottom: 25px;
            color: #8f96a3;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #303541;
            border-radius: 10px;
            background: #0e1015;
            color: white;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #666;
        }

        .generate {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: white;
            color: black;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .generate:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            margin-top: 15px;
            text-align: center;
            color: #999;
            font-size: 13px;
        }

        .result {
            display: none;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid #292e38;
        }

        .short-box {
            display: flex;
            gap: 10px;
        }

        .short-box input {
            flex: 1;
        }

        .copy {
            width: 100px;
            border: 0;
            border-radius: 10px;
            background: white;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }

        .success {
            display: none;
            margin-top: 10px;
            color: #70df70;
            font-size: 13px;
        }

        @media(max-width: 500px) {

            .container {
                padding: 22px;
            }

            .short-box {
                flex-direction: column;
            }

            .copy {
                width: 100%;
                padding: 13px;
            }

        }

    </style>

</head>


<body>


<div class="container">

    <h1>Short Link Generator</h1>

    <div class="subtitle">
        Create a short redirect link
    </div>


    <label for="mainUrl">
        Main URL
    </label>


    <input
        type="url"
        id="mainUrl"
        placeholder="https://example.com/page"
        autocomplete="off"
    >


    <button
        class="generate"
        id="generate"
    >
        Generate Short Link
    </button>


    <div
        class="loading"
        id="loading"
    >
        Creating short link...
    </div>


    <div
        class="result"
        id="result"
    >

        <label>
            Short Link
        </label>


        <div class="short-box">

            <input
                type="text"
                id="shortUrl"
                readonly
            >

            <button
                class="copy"
                id="copy"
            >
                Copy
            </button>

        </div>


        <div
            class="success"
            id="success"
        >
            Link copied successfully!
        </div>

    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getDatabase,
    ref,
    set
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


// ==========================================
// FIREBASE CONFIG
// ==========================================

const firebaseConfig = {

    apiKey:
        "AIzaSyAw5aG4WghgQtTqtSWY7YBMo28p-eTx1BM",

    authDomain:
        "realtime-64520.firebaseapp.com",

    databaseURL:
        "https://realtime-64520-default-rtdb.firebaseio.com",

    projectId:
        "realtime-64520",

    storageBucket:
        "realtime-64520.firebasestorage.app",

    messagingSenderId:
        "116693487239",

    appId:
        "1:116693487239:web:e3075a83602a20af2cb222",

    measurementId:
        "G-9LNW64HM7Y"

};


// Initialize Firebase

const app =
    initializeApp(firebaseConfig);

const db =
    getDatabase(app);


// ==========================================
// GENERATE RANDOM SHORT ID
// ==========================================

function generateShortId(length = 7) {

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";

    const randomValues =
        new Uint32Array(length);

    crypto.getRandomValues(
        randomValues
    );

    let id = "";

    for (
        let i = 0;
        i < length;
        i++
    ) {

        id +=
            chars[
                randomValues[i] %
                chars.length
            ];

    }

    return id;
}


// ==========================================
// GENERATE SHORT LINK
// ==========================================

document
    .getElementById("generate")
    .addEventListener(
        "click",
        async function () {

            const mainUrl =
                document
                    .getElementById("mainUrl")
                    .value
                    .trim();


            if (!mainUrl) {

                alert(
                    "Please enter the main URL."
                );

                return;
            }


            let parsedUrl;


            try {

                parsedUrl =
                    new URL(mainUrl);

            } catch {

                alert(
                    "Please enter a valid URL."
                );

                return;
            }


            // Only HTTP / HTTPS

            if (
                parsedUrl.protocol !== "https:" &&
                parsedUrl.protocol !== "http:"
            ) {

                alert(
                    "Only HTTP and HTTPS URLs are allowed."
                );

                return;
            }


            const generateButton =
                document
                    .getElementById("generate");


            const loading =
                document
                    .getElementById("loading");


            const result =
                document
                    .getElementById("result");


            const output =
                document
                    .getElementById("shortUrl");


            generateButton.disabled =
                true;

            loading.style.display =
                "block";


            try {

                let shortId;

                let created = false;


                /*
                 * Generate a unique ID.
                 */

                while (!created) {

                    shortId =
                        generateShortId(7);


                    const linkRef =
                        ref(
                            db,
                            "links/" +
                            shortId
                        );


                    /*
                     * Save only the destination URL.
                     */

                    await set(
                        linkRef,
                        {
                            url:
                                parsedUrl.href,

                            active:
                                true,

                            createdAt:
                                Date.now()
                        }
                    );


                    created = true;

                }


                /*
                 * Build short URL.
                 *
                 * Example:
                 *
                 * https://domain.com/index.html?l=Ab72KxP
                 */

                const shortLink =
                    window.location.origin +
                    "/index.html?l=" +
                    shortId;


                /*
                 * Show ONLY short link.
                 */

                output.value =
                    shortLink;


                result.style.display =
                    "block";


            } catch (error) {

                console.error(error);

                alert(
                    "Unable to create short link."
                );

            }


            loading.style.display =
                "none";

            generateButton.disabled =
                false;

        }
    );


// ==========================================
// COPY SHORT LINK
// ==========================================

document
    .getElementById("copy")
    .addEventListener(
        "click",
        async function () {

            const output =
                document
                    .getElementById("shortUrl");


            try {

                await navigator
                    .clipboard
                    .writeText(
                        output.value
                    );

            } catch {

                output.select();

                document.execCommand(
                    "copy"
                );

            }


            const success =
                document
                    .getElementById("success");


            success.style.display =
                "block";


            setTimeout(
                function () {

                    success.style.display =
                        "none";

                },
                2000
            );

        }
    );

</script>


</body>

</html>
