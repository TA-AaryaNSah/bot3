<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Link Maker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 40px; width: 90%; max-width: 500px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        h2 { font-size: 24px; margin-bottom: 20px; text-align: center; color: #3b82f6; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #94a3b8; }
        input { width: 100%; padding: 12px; background: rgba(15, 23, 42, 0.6); border: 1px solid #334155; border-radius: 8px; color: white; font-size: 14px; outline: none; }
        .btn { background: #3b82f6; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn:hover { background: #2563eb; }
        .result-box { margin-top: 25px; display: none; }
        .result-box.active { display: block; }
        .output-url { background: #020617; padding: 15px; border-radius: 8px; border: 1px dashed #475569; word-break: break-all; font-size: 13px; color: #10b981; margin-bottom: 10px; }
        .btn-copy { background: #10b981; }
        .btn-copy:hover { background: #059669; }
    </style>
</head>
<body>
    <div class="container">
        <h2>
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
            Link Maker
        </h2>
        <div class="input-group">
            <label>Protected Base URL:</label>
            <input type="url" id="baseUrl" value="https://securemylink.vercel.app" required>
        </div>
        <button class="btn" onclick="generateSecureLink()">Generate Link</button>
        <div class="result-box" id="resultBox">
            <label>Shortener me ye link dalo:</label>
            <div class="output-url" id="finalUrl"></div>
            <button class="btn btn-copy" onclick="copyToClipboard()">Copy Link</button>
        </div>
    </div>

    <script>
        function generateToken() {
            // Generating a lengthy 48 character random string
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let token = '';
            for (let i = 0; i < 48; i++) {
                token += chars[Math.floor(Math.random() * chars.length)];
            }
            return token + 'asvm_secure';
        }

        function generateSecureLink() {
            let baseUrl = document.getElementById('baseUrl').value.trim();
            if (baseUrl.endsWith('/')) baseUrl = baseUrl.slice(0, -1);

            const finalUrl = `${baseUrl}/?sig=${generateToken()}`;

            document.getElementById('finalUrl').innerText = finalUrl;
            document.getElementById('resultBox').classList.add('active');
        }

        function copyToClipboard() {
            navigator.clipboard.writeText(document.getElementById('finalUrl').innerText).then(() => {
                alert("Copied! Paste this inside your shortener.");
            });
        }
    </script>
</body>
</html>
