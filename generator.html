<!DOCTYPE html>
<html>
<head>
    <title>Secure Link Generator</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; }
        .card { background: #1e293b; padding: 25px; border-radius: 12px; width: 400px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: none; }
        button { width: 100%; padding: 10px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Link Generator</h2>
        <input type="text" id="url" placeholder="Apna Website URL (eg: https://my-site.vercel.app)">
        <button onclick="generate()">Generate Secure Link</button>
        <p id="output" style="margin-top:20px; word-break: break-all; color: #10b981;"></p>
    </div>

    <script>
        function generate() {
            const base = document.getElementById('url').value;
            const token = Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
            const final = `${base}?sig=${token}asvm_secure`;
            document.getElementById('output').innerText = final;
        }
    </script>
</body>
</html>
